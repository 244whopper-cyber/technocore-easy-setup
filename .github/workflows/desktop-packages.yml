name: Desktop packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build app bundle
        run: ./scripts/build_macos.sh
      - name: Create distribution ZIP
        shell: bash
        run: |
          mkdir -p release/TechnocoreEasySetup
          cp -R dist/TechnocoreEasySetup.app release/TechnocoreEasySetup/
          cp packaging/macos/RELEASE_README.txt release/TechnocoreEasySetup/README-FIRST.txt
          ditto -c -k --sequesterRsrc --keepParent \
            release/TechnocoreEasySetup \
            "TechnocoreEasySetup-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "TechnocoreEasySetup-macOS-${{ matrix.arch }}.zip" \
            > "TechnocoreEasySetup-macOS-${{ matrix.arch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: TechnocoreEasySetup-macOS-${{ matrix.arch }}
          path: |
            TechnocoreEasySetup-macOS-${{ matrix.arch }}.zip
            TechnocoreEasySetup-macOS-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build app folder
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Create distribution ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\TechnocoreEasySetup | Out-Null
          Copy-Item -Recurse "dist\Technocore Easy Setup\*" release\TechnocoreEasySetup
          Copy-Item packaging\windows\RELEASE_README.txt release\TechnocoreEasySetup\README-FIRST.txt
          Compress-Archive -Path release\TechnocoreEasySetup -DestinationPath TechnocoreEasySetup-Windows-x64.zip
          $hash = (Get-FileHash TechnocoreEasySetup-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  TechnocoreEasySetup-Windows-x64.zip" | Set-Content -NoNewline TechnocoreEasySetup-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TechnocoreEasySetup-Windows-x64
          path: |
            TechnocoreEasySetup-Windows-x64.zip
            TechnocoreEasySetup-Windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Technocore Easy Setup $tag (Preview)" \
              --prerelease \
              --notes "Preview desktop packages. These builds are not Developer ID/notarization or Authenticode signed yet. Read README-FIRST.txt before opening them."
          fi
          gh release upload "$tag" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
